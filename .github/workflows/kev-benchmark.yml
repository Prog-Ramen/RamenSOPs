name: kev-benchmark
on:
  pull_request:
    paths:
      - 'ci/kev*'
      - 'ci/setup_kev.sh'
      - '.github/workflows/kev-benchmark.yml'
      - '.github/workflows/sop-merge.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kev-benchmark-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install pinned CPU environment
        run: bash ci/setup_kev.sh
      - name: Restore trusted main model cache (read only)
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ramensops-kev
          key: ramensops-kev4b-${{ hashFiles('ci/kev_download.py') }}
      - name: Download and verify pinned weights
        env:
          HF_HOME: /home/runner/.cache/ramensops-kev
        run: "$RUNNER_TEMP/kev-env/bin/python ci/kev_download.py"
      - name: Benchmark full quality and security review
        env:
          HF_HOME: /home/runner/.cache/ramensops-kev
          OMP_NUM_THREADS: '4'
          MKL_NUM_THREADS: '4'
          KEV_PREFIX_CACHE: '1'
        run: |
          set -euo pipefail
          /usr/bin/time -v "$RUNNER_TEMP/kev-env/bin/python" ci/kev_server.py > "$RUNNER_TEMP/kev-server.log" 2> "$RUNNER_TEMP/kev-resource.log" &
          kev_process=$!
          (while true; do
            date -u
            free -m
            ps -eo pid,ppid,rss,pcpu,etime,comm --sort=-rss | head -10
            vmstat 1 2
            sleep 30
          done) > "$RUNNER_TEMP/kev-monitor.log" 2>&1 &
          monitor_process=$!
          trap 'kill "$kev_process" "$monitor_process" || true' EXIT
          echo "$kev_process" > "$RUNNER_TEMP/kev.pid"
          python ci/kev_ready.py
          python ci/kev_benchmark.py
          ps -eo pid,rss,comm --sort=-rss | head -8
      - name: Preserve diagnostic logs even on timeout
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kev-context-diagnostics
          path: |
            ${{ runner.temp }}/kev-server.log
            ${{ runner.temp }}/kev-resource.log
            ${{ runner.temp }}/kev-monitor.log
          retention-days: 7
