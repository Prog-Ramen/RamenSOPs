name: registry-index
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
concurrency:
  group: registry-index
  cancel-in-progress: false
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - name: Build and publish sharded registry
        run: |
          set -euo pipefail
          main=$(git rev-parse HEAD)
          if git fetch --no-tags origin registry 2>/dev/null && git log -1 --format=%B FETCH_HEAD | grep -Fq "$main"; then exit 0; fi
          python ci/index.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan registry
          git rm -rq --cached .
          git add -f sops README.md
          git commit -m "Registry index for $main"
          git push --force origin registry
