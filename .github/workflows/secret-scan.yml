name: secret-scan
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to scan again
        required: true
        type: number
permissions:
  contents: read
  pull-requests: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned secret scanner
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan PR commits with trusted configuration
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/pulls/$PR" > "$RUNNER_TEMP/pr.json"
          python ci/resolve.py "$RUNNER_TEMP/pr.json" >> "$RUNNER_TEMP/pr.env"
          source "$RUNNER_TEMP/pr.env"
          git fetch --no-tags origin "refs/pull/$PR/head"
          test "$(git rev-parse FETCH_HEAD)" = "$HEAD_SHA"
          "$RUNNER_TEMP/gitleaks" git --config ci/gitleaks.toml --gitleaks-ignore-path /dev/null \
            --redact=100 --no-banner --log-opts="origin/main..$HEAD_SHA" .
      - name: Scan main
        if: github.event_name == 'push'
        run: |
          "$RUNNER_TEMP/gitleaks" git --config ci/gitleaks.toml --gitleaks-ignore-path /dev/null --redact=100 --no-banner .
